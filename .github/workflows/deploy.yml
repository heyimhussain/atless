name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check API secrets present
        run: |
          if [ -z "${{ secrets.VITE_GEMINI_API_KEY }}" ]; then
            echo "::error::VITE_GEMINI_API_KEY secret is empty — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_ELEVENLABS_API_KEY }}" ]; then
            echo "::error::VITE_ELEVENLABS_API_KEY secret is empty — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Both API secrets are set."

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_ELEVENLABS_API_KEY: ${{ secrets.VITE_ELEVENLABS_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
